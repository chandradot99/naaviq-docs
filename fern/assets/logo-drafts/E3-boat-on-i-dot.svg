<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" stroke-linejoin="round">
  <!-- Full wordmark, including a natural "i" dot we'll cover -->
  <text x="20" y="64" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" fill="#1E40AF" letter-spacing="-2.5">naaviq</text>
  <!-- White rectangle to mask the default i-tittle, sized conservatively -->
  <rect x="155" y="18" width="14" height="14" fill="white"/>
  <!-- Tiny paper boat in place of the dot -->
  <g transform="translate(152, 14)">
    <path d="M 10 0 L 10 14 L 18 14 Z" fill="#1E40AF"/>
    <path d="M 2 14 L 20 14 L 17 20 L 5 20 Z" fill="#3B82F6"/>
  </g>
  <!-- Subtle wave line as secondary signature -->
  <path d="M 22 82 Q 44 76 66 82 T 110 82 T 154 82 T 198 82 T 220 82"
        stroke="#06B6D4" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
</svg>
